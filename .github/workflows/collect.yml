name: Collect backtest data
on:
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: build-dashboard        # don't race the dashboard commit step
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python collect_data.py
      - name: Commit data
        run: |
          git config user.name "walls-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data
          git commit -m "backtest data $(date -u '+%F %H:%M UTC')" || echo "no changes"
          git pull --rebase origin main || true
          git push
