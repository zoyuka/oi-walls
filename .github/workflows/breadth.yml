name: Compute market breadth
on:
  schedule:
    # 5:10pm ET after close (EDT; use "10 22" in winter) + 8:05am ET refresh
    - cron: "10 21 * * 1-5"
    - cron: "5 12 * * 1-5"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: build-dashboard
  cancel-in-progress: false
jobs:
  breadth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt lxml
      - run: python breadth.py
      - name: Commit breadth
        run: |
          git config user.name "walls-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs data
          git commit -m "breadth $(date -u '+%F %H:%M UTC')" || echo "no changes"
          git pull --rebase origin main || true
          git push
