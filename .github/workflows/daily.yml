name: Build OI Walls dashboard
on:
  schedule:
    # All times UTC. Current entries assume EDT (UTC-4); in winter (EST) shift hours +1:
    #   morning run -> "15 13 * * 1-5", intraday -> "4-59/10 14-21 * * 1-5"
    - cron: "15 12 * * 1-5"         # 8:15am ET — morning baseline right after OCC OI refresh
    - cron: "4-59/10 13-20 * * 1-5" # every 10 min, 9:04am–4:54pm ET (premarket through close)
  workflow_dispatch: {}              # manual trigger from GitHub app / API
permissions:
  contents: write
concurrency:
  group: build-dashboard
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python make_site.py
      - name: Commit dashboard
        run: |
          git config user.name "walls-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          # Amend the previous bot commit instead of stacking 40+ commits/day,
          # so the repo stays small despite intraday refreshes.
          if [ "$(git log -1 --pretty=%an)" = "walls-bot" ]; then
            git commit --amend -m "walls $(date -u '+%F %H:%M UTC')"
            git push --force-with-lease
          else
            git commit -m "walls $(date -u '+%F %H:%M UTC')"
            git push
          fi
