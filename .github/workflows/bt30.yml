name: Collect bt30 intraday history
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install yfinance
      - run: python collect_bt30.py
      - run: |
          git config user.name "walls-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/bt30
          git diff --cached --quiet || { git commit -m "bt30 data $(date -u '+%F %H:%M')"; git push; }
